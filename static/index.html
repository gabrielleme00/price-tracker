<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Precinho</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js para o gráfico de histórico -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-slate-50 min-h-screen text-slate-800 font-sans antialiased">

  <div class="max-w-6xl mx-auto px-4 py-8">

    <!-- Header -->
    <header
      class="flex flex-col sm:flex-row justify-between items-center bg-white rounded-2xl shadow-sm border border-slate-100 p-6 mb-8 gap-4">
      <div class="flex items-center gap-3">
        <div
          class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl font-bold shadow-inner">
          <i class="fa-solid fa-chart-line"></i>
        </div>
        <div>
          <h1 class="text-2xl font-black tracking-tight text-slate-900">Meu Precinho</h1>
          <p class="text-xs text-slate-500 font-medium">Monitoramento inteligente de preços</p>
        </div>
      </div>
      <button onclick="triggerScrape()" id="scrapeBtn"
        class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold px-5 py-2.5 rounded-xl shadow-lg shadow-indigo-100 transition-all duration-200 text-sm">
        <i class="fa-solid fa-rotate"></i> Executar Busca
      </button>
    </header>

    <!-- Formulário de Cadastro Moderno -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 mb-8">
      <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-plus-circle"></i> Adicionar Novo Produto
      </h2>
      <form id="productForm" onsubmit="addProduct(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-4">
        <div class="lg:col-span-3">
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nome do Produto</label>
          <input type="text" id="name" placeholder="Ex: Vestido Rosa" required
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
        </div>
        <div class="lg:col-span-2">
          <label class="block text-xs font-semibold text-slate-600 mb-1">Loja</label>
          <select id="store" value="SHEIN" placeholder="SHEIN" required
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
            <option value="SHEIN">SHEIN</option>
          </select>
        </div>
        <div class="lg:col-span-4">
          <label class="block text-xs font-semibold text-slate-600 mb-1">URL Completa</label>
          <input type="url" id="url" placeholder="https://br.shein.com/..." required
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
        </div>
        <div class="lg:col-span-3">
          <label class="block text-xs font-semibold text-slate-600 mb-1">Preço Alvo (R$)</label>
          <div class="flex gap-2">
            <input type="number" step="0.01" id="target_price" placeholder="120.00" required
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
            <button type="submit"
              class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-semibold px-5 py-2.5 rounded-xl shadow-lg shadow-emerald-100 transition-all duration-200 text-sm whitespace-nowrap">
              Adicionar
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Tabela de Produtos -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="p-6 border-b border-slate-100 flex justify-between items-center">
        <h2 class="font-bold text-slate-800">Produtos Monitorados</h2>
        <span id="productCount" class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-medium">0
          itens</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50/70 text-slate-400 uppercase text-[11px] tracking-wider font-bold">
              <th class="py-3 px-6">Foto</th>
              <th class="py-3 px-6">Nome</th>
              <th class="py-3 px-6">Loja</th>
              <th class="py-3 px-6">Preço Atual</th>
              <th class="py-3 px-6">Alvo</th>
              <th class="py-3 px-6">Status</th>
              <th class="py-3 px-6 text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="productTableBody" class="divide-y divide-slate-100 text-sm">
            <!-- Carregado via JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Modal do Gráfico de Histórico -->
  <div id="chartModal"
    class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50 transition-opacity">
    <div
      class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-6 relative border border-slate-100 transform transition-all">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h3 id="modalProductName" class="text-lg font-bold text-slate-900">Histórico de Preços</h3>
          <p class="text-xs text-slate-500">Evolução do valor do produto ao longo do tempo</p>
        </div>
        <button onclick="closeChartModal()"
          class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="relative h-72 w-full">
        <canvas id="priceChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Scripts da Interface -->
  <script>
    let priceChartInstance = null;

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        const products = await res.json();
        const tbody = document.getElementById('productTableBody');
        document.getElementById('productCount').innerText = `${products.length} itens`;
        tbody.innerHTML = '';

        if (products.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center py-12 text-slate-400 font-medium">Nenhum produto cadastrado ainda.</td></tr>`;
          return;
        }

        products.forEach(p => {
          const isTriggered = p.last_price !== null && p.last_price <= p.target_price;
          const priceBadge = p.last_price !== null
            ? `<span class="font-bold ${isTriggered ? 'text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-100' : 'text-slate-900'}">R$ ${p.last_price.toFixed(2)}</span>`
            : `<span class="text-slate-400 italic text-xs">Pendente</span>`;

          const imgTag = p.image_url
            ? `<img src="${p.image_url}" class="w-12 h-12 object-cover rounded-xl shadow-sm border border-slate-200">`
            : `<div class="w-12 h-12 bg-slate-100 rounded-xl flex items-center justify-center text-slate-400 text-xs"><i class="fa-solid fa-image"></i></div>`;

          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-50/50 transition";
          tr.innerHTML = `
                        <td class="py-4 px-6">${imgTag}</td>
                        <td class="py-4 px-6">
                            <div class="flex items-center gap-2">
                                <input type="text" value="${p.name}" id="name-${p.id}" class="bg-transparent hover:bg-slate-100 focus:bg-white border border-transparent focus:border-slate-300 rounded-lg px-2 py-1.5 text-sm w-full font-medium transition" />
                                <button onclick="updateName(${p.id})" title="Salvar Nome" class="text-slate-400 hover:text-indigo-600 px-1 py-1 transition"><i class="fa-solid fa-floppy-disk"></i></button>
                            </div>
                        </td>
                        <td class="py-4 px-6"><span class="bg-slate-100 text-slate-700 text-xs font-semibold px-2.5 py-1 rounded-md uppercase">${p.store}</span></td>
                        <td class="py-4 px-6">${priceBadge}</td>
                        <td class="py-4 px-6 font-semibold text-slate-600">R$ ${p.target_price.toFixed(2)}</td>
                        <td class="py-4 px-6"><span class="text-xs text-slate-500 font-medium">${p.last_status || 'Aguardando'}</span></td>
                        <td class="py-4 px-6 text-right space-x-1 whitespace-nowrap">
                            <button onclick="openChart(${p.id}, '${p.name.replace(/'/g, "\\'")}')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1.5 rounded-lg text-xs font-semibold transition" title="Ver Histórico"><i class="fa-solid fa-chart-area mr-1"></i> Gráfico</button>
                            <a href="${p.url}" target="_blank" class="inline-block bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold transition" title="Abrir Link"><i class="fa-solid fa-external-link-alt"></i></a>
                            <button onclick="deleteProduct(${p.id})" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-1.5 rounded-lg text-xs font-semibold transition" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error("Erro ao carregar produtos:", err);
      }
    }

    async function addProduct(e) {
      e.preventDefault();
      const data = {
        name: document.getElementById('name').value,
        store: document.getElementById('store').value,
        url: document.getElementById('url').value,
        target_price: parseFloat(document.getElementById('target_price').value)
      };

      const res = await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      if (res.ok) {
        document.getElementById('productForm').reset();
        loadProducts();
      } else {
        alert('Erro ao cadastrar produto.');
      }
    }

    async function updateName(id) {
      const newName = document.getElementById(`name-${id}`).value;
      const res = await fetch(`/api/products/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: newName })
      });

      if (res.ok) {
        loadProducts();
      } else {
        alert('Erro ao atualizar nome.');
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Deseja realmente excluir este produto?')) return;
      const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
      if (res.ok) loadProducts();
    }

    async function triggerScrape() {
      const btn = document.getElementById('scrapeBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Executando...';

      try {
        const res = await fetch('/api/scrape-now', { method: 'POST' });
        if (res.ok) {
          setTimeout(loadProducts, 7000);
          setTimeout(loadProducts, 15000);
        } else {
          alert('Erro ao iniciar varredura.');
        }
      } catch (err) {
        console.error(err);
      } finally {
        setTimeout(() => {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-rotate"></i> Executar Varredura';
        }, 8000);
      }
    }

    async function openChart(productId, productName) {
      document.getElementById('modalProductName').innerText = productName;
      document.getElementById('chartModal').classList.remove('hidden');
      document.getElementById('chartModal').classList.add('flex');

      try {
        const res = await fetch(`/api/history/${productId}`);
        const history = await res.json();

        const labels = history.map(h => new Date(h.scraped_at).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }));
        const prices = history.map(h => h.price);

        const ctx = document.getElementById('priceChart').getContext('2d');

        if (priceChartInstance) {
          priceChartInstance.destroy();
        }

        priceChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Preço (R$)',
              data: prices,
              borderColor: '#6366f1',
              backgroundColor: 'rgba(99, 102, 241, 0.05)',
              borderWidth: 3,
              fill: true,
              tension: 0.3,
              pointBackgroundColor: '#6366f1',
              pointRadius: 4
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false }
            },
            scales: {
              y: {
                grid: { color: '#f1f5f9' },
                ticks: { font: { family: 'sans-serif' } }
              },
              x: {
                grid: { display: false },
                ticks: { font: { family: 'sans-serif' } }
              }
            }
          }
        });
      } catch (err) {
        console.error("Erro ao carregar histórico:", err);
      }
    }

    function closeChartModal() {
      document.getElementById('chartModal').classList.add('hidden');
      document.getElementById('chartModal').classList.remove('flex');
    }

    // Carrega os produtos ao iniciar
    loadProducts();
  </script>
</body>

</html>
