<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Meu Precinho</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --teal: #0ABAB5;
      --teal-dark: #078F8B;
      --pink: #FFB6C1;
      --peach: #FFDAB9;
      --lavender: #E6E6FA;
      --lemon: #FFFACD;
      --ink: #4A3F55;
      --muted: #8B7F95;
      --paper: #FFFDF3;
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Nunito', ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background-color: var(--lemon);
      background-image: radial-gradient(rgba(230, 230, 250, 0.95) 2px, transparent 2px);
      background-size: 26px 26px;
      background-position: 0 0;
    }

    ::selection {
      background: var(--pink);
      color: var(--ink);
    }

    .font-display {
      font-family: 'Fredoka', ui-sans-serif, sans-serif;
    }

    .retro-card {
      position: relative;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 26px;
      box-shadow: 8px 8px 0 var(--lavender);
    }

    .retro-card.shadow-pink {
      box-shadow: 8px 8px 0 var(--pink);
    }

    .retro-card.shadow-peach {
      box-shadow: 8px 8px 0 var(--peach);
    }

    .retro-card.shadow-teal {
      box-shadow: 8px 8px 0 rgba(10, 186, 181, 0.35);
    }

    .btn-retro {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      letter-spacing: .01em;
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      padding: .62rem 1.35rem;
      box-shadow: 4px 4px 0 var(--ink);
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease;
    }

    .btn-retro:hover:not(:disabled) {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0 var(--ink);
    }

    .btn-retro:active:not(:disabled) {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .btn-retro:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    .btn-teal {
      background: var(--teal);
      color: #fff;
    }

    .btn-teal:hover:not(:disabled) {
      background: var(--teal-dark);
    }

    .btn-pink {
      background: var(--pink);
      color: var(--ink);
    }

    .btn-mini {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      font-family: 'Fredoka', sans-serif;
      font-size: .72rem;
      font-weight: 600;
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: .35rem .72rem;
      box-shadow: 2px 2px 0 var(--ink);
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease;
    }

    .btn-mini:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--ink);
    }

    .btn-mini:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 var(--ink);
    }

    .btn-lavender {
      background: var(--lavender);
      color: var(--ink);
    }

    .btn-lemon {
      background: var(--lemon);
      color: var(--ink);
    }

    .btn-white {
      background: #fff;
      color: var(--ink);
    }

    .retro-input {
      width: 100%;
      background: var(--paper);
      border: 2.5px solid var(--ink);
      border-radius: 14px;
      padding: .6rem .9rem;
      font-family: 'Nunito', sans-serif;
      font-size: .875rem;
      font-weight: 700;
      color: var(--ink);
      transition: box-shadow .15s ease, border-color .15s ease, background-color .15s ease;
    }

    .retro-input::placeholder {
      color: #B4AABD;
      font-weight: 500;
    }

    .retro-input:focus {
      outline: none;
      background: #fff;
      border-color: var(--teal);
      box-shadow: 0 0 0 4px rgba(255, 182, 193, 0.55);
    }

    select.retro-input {
      appearance: none;
      padding-right: 2.4rem;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234A3F55' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat;
      background-position: right .8rem center;
      background-size: 1rem;
      cursor: pointer;
    }

    .field-label {
      display: block;
      font-family: 'Fredoka', sans-serif;
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .4rem;
    }

    .retro-table thead tr {
      background: var(--lavender);
      border-bottom: 3px solid var(--ink);
    }

    .retro-table thead th {
      font-family: 'Fredoka', sans-serif;
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--ink);
      padding: .85rem 1.5rem;
      white-space: nowrap;
    }

    .retro-table tbody tr {
      border-bottom: 2px dashed rgba(74, 63, 85, .18);
      transition: background-color .15s ease;
    }

    .retro-table tbody tr:last-child {
      border-bottom: none;
    }

    .retro-table tbody tr:hover {
      background: var(--paper);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      font-family: 'Fredoka', sans-serif;
      font-size: .72rem;
      font-weight: 600;
      padding: .25rem .65rem;
      border-radius: 999px;
      border: 2px solid var(--ink);
      white-space: nowrap;
    }

    .badge-count {
      background: var(--lemon);
      color: var(--ink);
    }

    .badge-store {
      background: var(--peach);
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .badge-price {
      background: #fff;
      color: var(--ink);
    }

    .badge-price-ok {
      background: var(--teal);
      color: #fff;
    }

    /* Badges de tamanho */
    .badge-size {
      background: var(--peach);
      color: var(--ink);
      font-size: .66rem;
      padding: .1rem .45rem;
      border-width: 1.5px;
      border-radius: 8px;
      box-shadow: 1px 1px 0 var(--ink);
      line-height: 1.25;
      white-space: nowrap;
    }

    .sizes-cell {
      max-width: 180px;
    }

    .thumb {
      width: 3rem;
      height: 3rem;
      object-fit: cover;
      border-radius: 14px;
      border: 2.5px solid var(--ink);
      box-shadow: 2px 2px 0 var(--pink);
      background: #fff;
    }

    .thumb-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--lavender);
      color: var(--muted);
      font-size: .8rem;
    }

    .name-input {
      width: 100%;
      background: transparent;
      border: 2px dashed transparent;
      border-radius: 10px;
      padding: .35rem .5rem;
      font-family: 'Nunito', sans-serif;
      font-size: .875rem;
      font-weight: 800;
      color: var(--ink);
      transition: all .15s ease;
    }

    .name-input:hover {
      border-color: var(--pink);
      background: var(--paper);
    }

    .name-input:focus {
      outline: none;
      border-color: var(--teal);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(230, 230, 250, 0.9);
    }

    #chartModal {
      background: rgba(74, 63, 85, .45);
      backdrop-filter: blur(4px);
    }

    .modal-card {
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 26px;
      box-shadow: 10px 10px 0 var(--lavender);
    }

    .tape {
      position: absolute;
      top: -13px;
      left: 2.5rem;
      height: 24px;
      width: 7rem;
      border: 2px solid var(--ink);
      border-radius: 4px;
      transform: rotate(-3deg);
      background: repeating-linear-gradient(45deg, var(--pink) 0 6px, var(--peach) 6px 12px);
    }

    .logo-box {
      background: var(--lavender);
      border: 2.5px solid var(--ink);
      border-radius: 18px;
      box-shadow: 3px 3px 0 var(--teal);
      color: var(--teal-dark);
      transform: rotate(-4deg);
      transition: transform .2s ease;
    }

    .logo-box:hover {
      transform: rotate(4deg) scale(1.05);
    }

    .title-shadow {
      text-shadow: 2px 2px 0 var(--pink);
    }
  </style>
</head>

<body class="min-h-screen antialiased">

  <div class="max-w-6xl mx-auto px-4 py-8">

    <header class="retro-card shadow-pink flex flex-col sm:flex-row justify-between items-center p-6 mb-10 gap-4">
      <div class="flex items-center gap-4">
        <div class="logo-box w-14 h-14 flex items-center justify-center text-2xl font-bold">
          <i class="fa-solid fa-chart-line"></i>
        </div>
        <div>
          <h1 class="font-display title-shadow text-3xl font-bold tracking-tight" style="color: var(--ink);">
            O Meu Precinho
          </h1>
          <p class="text-[11px] font-extrabold uppercase tracking-[0.14em]" style="color: var(--muted);">
            Será que o preço já caiu?
          </p>
        </div>
      </div>
      <button onclick="triggerScrape()" id="scrapeBtn" class="btn-retro btn-pink text-sm">
        <i class="fa-solid fa-rotate"></i> Executar Busca
      </button>
    </header>

    <div class="retro-card shadow-peach p-6 mb-10">
      <div class="tape"></div>
      <h2 class="font-display text-sm font-semibold uppercase tracking-[0.14em] mb-4 flex items-center gap-2"
        style="color: var(--muted);">
        <i class="fa-solid fa-plus-circle" style="color: var(--teal);"></i> Adicionar Novo Produto
      </h2>
      <form id="productForm" onsubmit="addProduct(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-4">
        <div class="lg:col-span-3">
          <label class="field-label" for="name">Nome do Produto</label>
          <input type="text" id="name" placeholder="Ex: Vestido Rosa" required class="retro-input">
        </div>
        <div class="lg:col-span-2">
          <label class="field-label" for="store">Loja</label>
          <select id="store" required class="retro-input">
            <option value="SHEIN">SHEIN</option>
          </select>
        </div>
        <div class="lg:col-span-4">
          <label class="field-label" for="url">URL Completa</label>
          <input type="url" id="url" placeholder="https://br.shein.com/..." required class="retro-input">
        </div>
        <div class="lg:col-span-3">
          <label class="field-label" for="target_price">Preço Alvo (R$)</label>
          <div class="flex gap-2">
            <input type="number" step="0.01" id="target_price" placeholder="120.00" required class="retro-input">
            <button type="submit" class="btn-retro btn-teal text-sm whitespace-nowrap">Adicionar</button>
          </div>
        </div>
      </form>
    </div>

    <div class="retro-card shadow-teal overflow-hidden">
      <div class="p-6 flex justify-between items-center" style="border-bottom: 3px solid var(--ink);">
        <h2 class="font-display text-lg font-semibold" style="color: var(--ink);">Produtos Monitorados</h2>
        <span id="productCount" class="badge badge-count">0 itens</span>
      </div>
      <div class="overflow-x-auto">
        <table class="retro-table w-full text-left border-collapse">
          <thead>
            <tr>
              <th>Foto</th>
              <th>Nome</th>
              <th>Loja</th>
              <th>Preço Atual</th>
              <th>Alvo</th>
              <th>Tamanhos</th>
              <th>Status</th>
              <th class="text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="productTableBody" class="text-sm"></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Modal do Gráfico de Histórico -->
  <div id="chartModal" class="fixed inset-0 hidden items-center justify-center p-4 z-50 transition-opacity">
    <div class="modal-card max-w-2xl w-full p-6 relative">
      <div class="flex justify-between items-start gap-4 mb-4">
        <div>
          <h3 id="modalProductName" class="font-display text-xl font-semibold" style="color: var(--ink);">
            Histórico de Preços</h3>
          <p class="text-xs font-bold" style="color: var(--muted);">Evolução do valor do produto ao longo do tempo</p>
          <p id="modalSizes" class="text-xs font-bold mt-2 flex flex-wrap items-center gap-1"
            style="color: var(--muted);"></p>
        </div>
        <button onclick="closeChartModal()"
          class="w-9 h-9 flex items-center justify-center shrink-0 transition-transform duration-150 hover:-translate-y-0.5"
          style="background: var(--pink); border: 2.5px solid var(--ink); border-radius: 999px; box-shadow: 2px 2px 0 var(--ink); color: var(--ink);">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="relative h-72 w-full">
        <canvas id="priceChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    let priceChartInstance = null;
    let currentProducts = [];

    function renderSizesBadges(sizesStr, emptyFallback = '<span class="text-xs italic" style="color:#B4AABD;">—</span>') {
      const arr = (sizesStr || "").split(",").map(s => s.trim()).filter(Boolean);
      if (!arr.length) return emptyFallback;
      return arr.map(s => `<span class="badge badge-size">${s}</span>`).join("");
    }

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        const products = await res.json();
        currentProducts = products;

        const tbody = document.getElementById('productTableBody');
        document.getElementById('productCount').innerText = `${products.length} itens`;
        tbody.innerHTML = '';

        if (products.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" class="text-center py-12 font-bold" style="color: var(--muted);">Nenhum produto cadastrado ainda.</td></tr>`;
          return;
        }

        products.forEach(p => {
          const isTriggered = p.last_price !== null && p.last_price <= p.target_price;

          const priceBadge = p.last_price !== null
            ? `<span class="badge ${isTriggered ? 'badge-price-ok' : 'badge-price'}">R$ ${p.last_price.toFixed(2)}</span>`
            : `<span class="text-xs italic" style="color: #B4AABD;">Pendente</span>`;

          const imgTag = p.image_url
            ? `<img src="${p.image_url}" alt="${p.name}" class="thumb">`
            : `<div class="thumb thumb-empty"><i class="fa-solid fa-image"></i></div>`;

          const tr = document.createElement('tr');
          tr.innerHTML = `
                        <td class="py-4 px-6">${imgTag}</td>
                        <td class="py-4 px-6">
                            <div class="flex items-center gap-1.5">
                                <input type="text" value="${p.name}" id="name-${p.id}" class="name-input" />
                                <button onclick="updateName(${p.id})" title="Salvar Nome" class="btn-mini btn-lemon"><i class="fa-solid fa-floppy-disk"></i></button>
                            </div>
                        </td>
                        <td class="py-4 px-6"><span class="badge badge-store">${p.store}</span></td>
                        <td class="py-4 px-6">${priceBadge}</td>
                        <td class="py-4 px-6 font-display font-semibold" style="color: var(--ink);">R$ ${p.target_price.toFixed(2)}</td>
                        <td class="py-4 px-6 sizes-cell">
                            <div class="flex flex-wrap gap-1">${renderSizesBadges(p.last_sizes)}</div>
                        </td>
                        <td class="py-4 px-6"><span class="text-xs font-bold" style="color: var(--muted);">${p.last_status || 'Aguardando'}</span></td>
                        <td class="py-4 px-6 text-right whitespace-nowrap">
                            <div class="flex justify-end gap-1.5">
                                <button onclick="openChart(${p.id})" class="btn-mini btn-lavender" title="Ver Histórico"><i class="fa-solid fa-chart-area"></i> Gráfico</button>
                                <a href="${p.url}" target="_blank" class="btn-mini btn-white" title="Abrir Link"><i class="fa-solid fa-external-link-alt"></i></a>
                                <button onclick="deleteProduct(${p.id})" class="btn-mini btn-pink" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </td>
                    `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error("Erro ao carregar produtos:", err);
      }
    }

    async function addProduct(e) {
      e.preventDefault();
      const data = {
        name: document.getElementById('name').value,
        store: document.getElementById('store').value,
        url: document.getElementById('url').value,
        target_price: parseFloat(document.getElementById('target_price').value)
      };

      const res = await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      if (res.ok) {
        document.getElementById('productForm').reset();
        loadProducts();
      } else {
        alert('Erro ao cadastrar produto.');
      }
    }

    async function updateName(id) {
      const newName = document.getElementById(`name-${id}`).value;
      const res = await fetch(`/api/products/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: newName })
      });

      if (res.ok) {
        loadProducts();
      } else {
        alert('Erro ao atualizar nome.');
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Deseja realmente excluir este produto?')) return;
      const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
      if (res.ok) loadProducts();
    }

    async function triggerScrape() {
      const btn = document.getElementById('scrapeBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Executando...';

      try {
        const res = await fetch('/api/scrape-now', { method: 'POST' });
        if (res.ok) {
          setTimeout(loadProducts, 7000);
          setTimeout(loadProducts, 15000);
        } else {
          alert('Erro ao iniciar varredura.');
        }
      } catch (err) {
        console.error(err);
      } finally {
        setTimeout(() => {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-rotate"></i> Executar Busca';
        }, 8000);
      }
    }

    async function openChart(productId) {
      const product = currentProducts.find(p => p.id === productId) || {};

      document.getElementById('modalProductName').innerText =
        product.name || 'Histórico de Preços';

      // Descobre o timezone local do navegador do usuário
      const localTZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const tzLabel = (Intl.DateTimeFormat('pt-BR', { timeZoneName: 'short' })
        .formatToParts(new Date())
        .find(p => p.type === 'timeZoneName') || {}).value || localTZ;

      // Subtítulo: mostra o fuso local em uso
      let subtitle = document.querySelector('#chartModal p.text-xs.font-bold');
      if (subtitle) {
        subtitle.innerHTML = `Evolução do valor do produto ao longo do tempo · <b>Horário local (${tzLabel})</b>`;
      }

      // Badges de tamanho continuam iguais
      const sizesEl = document.getElementById('modalSizes');
      const sizesArr = (product.last_sizes || "").split(",").map(s => s.trim()).filter(Boolean);
      if (sizesArr.length) {
        sizesEl.innerHTML = `<span class="mr-1">📏 Tamanhos disponíveis:</span>` +
          sizesArr.map(s => `<span class="badge badge-size">${s}</span>`).join("");
      } else {
        sizesEl.innerHTML = `<span style="color:#B4AABD;font-style:italic;">📏 Tamanhos: —</span>`;
      }

      document.getElementById('chartModal').classList.remove('hidden');
      document.getElementById('chartModal').classList.add('flex');

      try {
        const res = await fetch(`/api/history/${productId}`);
        const history = await res.json();

        // --- Aqui é o ponto central: formatação no fuso LOCAL do navegador ---
        const fmt = new Intl.DateTimeFormat('pt-BR', {
          day: '2-digit',
          month: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          timeZone: localTZ,
        });

        const labels = history.map(h => {
          const d = new Date(h.scraped_at); // parses 'Z' como UTC
          return isNaN(d) ? '' : fmt.format(d); // renderiza no fuso local
        });
        const prices = history.map(h => h.price);
        const fullTimestamps = history.map(h => {
          const d = new Date(h.scraped_at);
          return isNaN(d) ? '' : d.toLocaleString('pt-BR', { timeZone: localTZ });
        });

        const ctx = document.getElementById('priceChart').getContext('2d');
        if (priceChartInstance) priceChartInstance.destroy();

        priceChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [{
              label: 'Preço (R$)',
              data: prices,
              borderColor: '#0ABAB5',
              backgroundColor: 'rgba(10, 186, 181, 0.10)',
              borderWidth: 3,
              fill: true,
              tension: 0.35,
              pointBackgroundColor: '#FFB6C1',
              pointBorderColor: '#4A3F55',
              pointBorderWidth: 2,
              pointRadius: 5,
              pointHoverRadius: 7,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: '#4A3F55',
                titleFont: { family: 'Fredoka', size: 13 },
                bodyFont: { family: 'Nunito', weight: '700' },
                padding: 10,
                cornerRadius: 10,
                displayColors: false,
                callbacks: {
                  // Mostra data/hora completa + fuso, já convertidos
                  title: (items) => {
                    const i = items[0].dataIndex;
                    return `${fullTimestamps[i]} (${tzLabel})`;
                  },
                  label: (item) => `Preço: R$ ${Number(item.raw).toFixed(2)}`,
                }
              }
            },
            scales: {
              y: {
                grid: { color: '#E6E6FA' },
                border: { display: false },
                ticks: { color: '#8B7F95', font: { family: 'Nunito', weight: '700' } }
              },
              x: {
                grid: { display: false },
                border: { display: false },
                ticks: { color: '#8B7F95', font: { family: 'Nunito', weight: '700' } }
              }
            }
          }
        });
      } catch (err) {
        console.error("Erro ao carregar histórico:", err);
      }
    }

    function closeChartModal() {
      document.getElementById('chartModal').classList.add('hidden');
      document.getElementById('chartModal').classList.remove('flex');
    }

    loadProducts();
  </script>
</body>

</html>
